<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ doc_title }}</title>
  <style>
{{ inline_css }}
  </style>
</head>
<body>

  <!-- Barra de utilidades en pantalla (oculta automáticamente al imprimir o en PDF) -->
  <div class="screen-action-bar no-print">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>Visor de Documento Académico</span>
    </div>
    <div class="btn-group">
      <button class="btn-action btn-secondary" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <span>▲ Subir</span>
      </button>
      <button class="btn-action" onclick="window.print()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>Imprimir / Exportar PDF</span>
      </button>
    </div>
  </div>

  <div class="document-container">
    {{ header_control_block }}

    <!-- Contenido Principal Renderizado desde Markdown -->
    <main class="doc-body">
      {{ content }}
    </main>
  </div>

</body>
</html>
